# Configuração do Eclipse Mosquitto
# Broker MQTT para o Pipeline IoT

# ========================================
# LISTENER PADRÃO (Port 1883)
# ========================================
# Aceita conexões MQTT não-criptografadas
listener 1883
protocol mqtt

# ========================================
# LISTENER TLS (Port 8883)
# ========================================
# Aceita conexões MQTT criptografadas
# listener 8883
# protocol mqtt
# cafile /mosquitto/config/ca.crt
# certfile /mosquitto/config/server.crt
# keyfile /mosquitto/config/server.key

# ========================================
# SEGURANÇA
# ========================================

# Permitir conexões anônimas (para desenvolvimento)
# Em produção, configure autenticação
allow_anonymous true

# Máximo de clientes conectados
max_connections -1

# ========================================
# PERSISTÊNCIA
# ========================================

# Habilitar persistência de mensagens
persistence true
persistence_location /mosquitto/data/

# Nome do arquivo de persistência
persistence_file mosquitto.db

# Intervalo de salvamento (em segundos)
autosave_interval 1800

# ========================================
# LOGGING
# ========================================

# Habilitatr logs
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Nível de log (debug, info, notice, warning, error)
log_type all

# ========================================
# PERFORMANCE
# ========================================

# Máximo de conexões TCP pendentes
max_queued_messages 1000

# Timeout de cliente inativo (segundos)
# 0 = desabilitado
connection_messages false

# ========================================
# WEBSOCKETS (Opcional)
# ========================================
# Descomente para suportar conexões MQTT via WebSocket

# listener 9001
# protocol websockets
# socket_domain ipv4

# ========================================
# AUTENTICAÇÃO (Opcional)
# ========================================
# Descomente para usar arquivo de senhas
# password_file /mosquitto/config/passwd

# ========================================
# CONTROLE DE ACESSO (Opcional)
# ========================================
# Descomente para usar arquivo de ACL
# acl_file /mosquitto/config/acl.conf
