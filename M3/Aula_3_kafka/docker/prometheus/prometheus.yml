# O job descobre os consumers pelo DNS interno do Docker (dns_sd_configs):
# o nome "consumer" resolve para TODAS as réplicas do serviço, então o
# experimento de escala (--scale consumer=3) não exige mudar esta configuração.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "iot-kafka-consumers"
    scrape_interval: 5s
    dns_sd_configs:
      - names: ["consumer"]
        type: A
        port: 8000
