# Data source provisionado automaticamente, equivalente ao criado por
# scripts/configure_grafana.sh. Dentro da rede docker, o Prometheus é
# acessível pelo nome do serviço (prometheus:9090).
apiVersion: 1

datasources:
  - name: Prometheus - Kafka IoT
    uid: prometheus-kafka-iot
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 5s
      httpMethod: GET
