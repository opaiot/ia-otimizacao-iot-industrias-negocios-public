global:
  # Intervalo curto para que a demonstração em aula apareça quase em tempo
  # real nos gráficos do Grafana.
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: publisher
    static_configs:
      - targets: ["publisher:9100"]

  - job_name: consumer
    static_configs:
      - targets: ["consumer:9100"]
