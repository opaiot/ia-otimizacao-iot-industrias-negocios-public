listener 1883
protocol mqtt

# Laboratório didático, sem TLS e sem autenticação: o foco aqui é
# observabilidade e resiliência, não segurança do transporte (isso é o
# laboratório de M2/Extras/Hands_On_HMAC_MQTT).
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
