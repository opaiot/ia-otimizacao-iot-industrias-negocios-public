# ARQUIVO ATIVO: é este que o broker lê. Conteúdo atual: ABERTO.
# Sem autenticação e sem ACL: qualquer cliente publica e assina qualquer tópico.
# É o cenário que a aula demonstra como inseguro.
#
# No passo 3.5 da prática você o substitui pela cópia de mosquitto-secure.conf.
# Para voltar a este estado:
#   cp mosquitto/config/mosquitto-open.conf mosquitto/config/mosquitto.conf

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# MQTT sem autenticação (apenas laboratório)
listener 1883
allow_anonymous true

# MQTT via WebSocket sem autenticação (apenas laboratório)
listener 9001
protocol websockets
allow_anonymous true
