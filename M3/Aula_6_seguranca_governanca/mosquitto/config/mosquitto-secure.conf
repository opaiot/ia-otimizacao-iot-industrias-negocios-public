# Configuração SEGURA, usada na segunda parte da prática.
# Autenticação por usuário/senha (password_file) e autorização por tópico (acl_file).
# Antes de usar, crie os usuários com mosquitto_passwd (veja o README da aula) e
# copie este conteúdo para mosquitto.conf.

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Registra no log as publicações e assinaturas negadas pela ACL ("Denied PUBLISH",
# "Denied SUBSCRIBE"). Sem isto, a negação é silenciosa para o cliente E para o log.
log_type all

# MQTT com autenticação
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# MQTT via WebSocket com autenticação
listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
