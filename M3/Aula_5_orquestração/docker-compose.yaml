name: opaiot-p5

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      # Configuração aberta e sem autenticação apenas para laboratório local.
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
    networks:
      - opaiot-iot

  kafka:
    # Mesma base da Aula 3: Kafka em KRaft, sem ZooKeeper, com um broker local.
    image: apache/kafka:4.0.0
    hostname: kafka
    ports:
      # Listener externo para ferramentas executadas no host.
      # Dentro da rede Docker os containers usam kafka:9092.
      - "29092:29092"
    environment:
      # Broker e controller no mesmo container: configuração KRaft single-node, sem ZooKeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT atende os containers; EXTERNAL atende clientes no host.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Como há apenas um broker, todos os tópicos internos precisam de fator de replicação 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      TZ: America/Sao_Paulo
    volumes:
      # Caminho de dados usado pela imagem apache/kafka:4.0.0, como na Aula 3.
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Checa a API do broker diretamente, antes de liberar os serviços dependentes.
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      - opaiot-iot

  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    # Job curto: cria o tópico da prática antes das aplicações Python produzirem/consumirem.
    command:
      - /bin/sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic "${KAFKA_TOPIC:-iot.telemetry}" \
          --partitions 3 \
          --replication-factor 1
        echo "Tópico ${KAFKA_TOPIC:-iot.telemetry} pronto:"
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --describe \
          --topic "${KAFKA_TOPIC:-iot.telemetry}"
    restart: "no"
    networks:
      - opaiot-iot

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: opaiot-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    restart: unless-stopped
    networks:
      - opaiot-iot

  sensor-simulator:
    build: ./services/sensor-simulator
    depends_on:
      mosquitto:
        condition: service_started
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC: ${SENSOR_MQTT_TOPIC:-iot/device-001/telemetry}
      DEVICE_ID: ${DEVICE_ID:-device-001}
      PUBLISH_INTERVAL: ${PUBLISH_INTERVAL:-2}
    restart: unless-stopped
    networks:
      - opaiot-iot

  mqtt-to-kafka:
    build: ./services/mqtt-to-kafka
    depends_on:
      mosquitto:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC: ${BRIDGE_MQTT_TOPIC:-iot/+/telemetry}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-iot.telemetry}
    restart: unless-stopped
    networks:
      - opaiot-iot

  iot-processor:
    build: ./services/iot-processor
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-iot.telemetry}
      KAFKA_GROUP_ID: iot-processor
      METRICS_PORT: 8000
    restart: unless-stopped
    networks:
      - opaiot-iot

  prometheus:
    image: prom/prometheus:v2.53.0
    depends_on:
      iot-processor:
        condition: service_started
    ports:
      - "9090:9090"
    volumes:
      # Prometheus coleta apenas o endpoint /metrics exposto pelo processador Python.
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - opaiot-iot

  grafana:
    image: grafana/grafana:10.4.0
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: America/Sao_Paulo
    volumes:
      # Provisionamento automático: datasource Prometheus e dashboard da prática.
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    networks:
      - opaiot-iot

volumes:
  kafka-data:
  prometheus-data:
  grafana-data:

networks:
  opaiot-iot:
    driver: bridge
