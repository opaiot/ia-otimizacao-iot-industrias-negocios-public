apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-processor
  namespace: opaiot-p5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iot-processor
  template:
    metadata:
      labels:
        app: iot-processor
    spec:
      containers:
        - name: iot-processor
          # Imagem construída localmente (veja o roteiro). Never: sem pull de registry.
          image: opaiot/iot-processor:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: metrics
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: KAFKA_TOPIC
              value: iot.telemetry
            - name: KAFKA_GROUP_ID
              value: iot-processor
            - name: METRICS_PORT
              value: "8000"
          # Enquanto /metrics não responde, o Pod fica fora do Service (READY 0/1).
          # A probe não ordena a subida dos Pods: só decide quando o Pod recebe tráfego.
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: iot-processor
  namespace: opaiot-p5
spec:
  selector:
    app: iot-processor
  ports:
    - name: metrics
      port: 8000
      targetPort: metrics
