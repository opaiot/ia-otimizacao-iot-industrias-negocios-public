apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-processor
  namespace: opaiot-p5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iot-processor
  template:
    metadata:
      labels:
        app: iot-processor
    spec:
      containers:
        - name: iot-processor
          # Construa a imagem localmente antes de aplicar em Minikube/K3s/KillerCoda.
          image: opaiot/iot-processor:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: metrics
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: KAFKA_TOPIC
              value: iot.telemetry
            - name: KAFKA_GROUP_ID
              value: iot-processor
            - name: METRICS_PORT
              value: "8000"
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: iot-processor
  namespace: opaiot-p5
spec:
  selector:
    app: iot-processor
  ports:
    - name: metrics
      port: 8000
      targetPort: metrics
